# p3y 腾讯 TSec Benchmark 单容器托管测评镜像 —— 本地一键 build + run。
# 与生产用的 docker-compose.yml（多服务: p3y+postgres）互不影响。
# 用法：
#   cp bench/.env.example bench/.env   # 填 P3Y_LLM_BASE_URL / OPENAI_API_KEY / BENCHMARK_TOKEN 等
#   docker compose -f docker-compose.bench.yml up --build      # 构建并前台运行（看日志）
#   docker compose -f docker-compose.bench.yml down            # 停止

services:
  p3y-bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    image: p3y-bench:latest
    container_name: p3y-bench
    env_file:
      - bench/.env
    # 本地彩排时共享宿主网络以便连本地 mock 平台或本地 VPN；容器内 PostgreSQL 绑定 127.0.0.1:5432。
    network_mode: host
    restart: "no"
